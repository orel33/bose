services:
  bose-bridge:
    # Version 1.8.5 ; code vérifié contre d588efde08faec505d3c3401c1c074076288d501.
    image: ghcr.io/sandervg/bose-soundtouch-bridge:1.8.5@sha256:b5eb0f483a61013be1868796ee2c9464f8e34a645ab0fc67ef913e8b958e0a5d
    network_mode: host
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      BOSE_HOST: ""
      SPEAKERS_JSON: '[{"host":"192.168.0.152"},{"host":"192.168.0.151"},{"host":"192.168.0.153"}]'
      SYNC_PRESETS_ON_STARTUP: "false"
      MQTT_HOST: ""
      # Bouton 3 : RTL2, configuré dans config/radios.env.
      # Boutons 4/5/6 : aucune affectation.
      PRESET_4_URL: ""
      PRESET_5_URL: ""
      PRESET_6_URL: ""
    env_file:
      - ./config/radios.env
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
